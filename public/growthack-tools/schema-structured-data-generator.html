// Escape a value for safe interpolation into an HTML attribute context.
function escapeAttr(value) {
    return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Map a schema.org @type back to this tool's internal template key.

// Core Functions
function validate(value, type) {
    if (!type || !validationRules[type]) return { valid: true };
    const rule = validationRules[type];
    return {
        valid: rule.pattern.test(value),
        message: rule.message
    };
}
function addSelectedSchema() {
    const select = document.getElementById('schemaSelect');
    const type = select.value;
    
    if (!type) {
        showNotification('Please select a schema type', 'error');
        return;
    }
    
    activeSchemas.add(type);
    select.value = '';
    updateActiveSchemas();
    updateSchemaFields();
    showNotification(`Added ${type} schema`, 'success');
}

function removeSchema(type) {
    activeSchemas.delete(type);
    delete formData[type];
    updateActiveSchemas();
    updateSchemaFields();
    generateJSON();
}

function updateActiveSchemas() {
    const container = document.getElementById('activeSchemas');
    container.innerHTML = Array.from(activeSchemas)
        .map(type => `
            <div class="schema-type-tag">
                ${type.charAt(0).toUpperCase() + type.slice(1)}
                <span onclick="removeSchema('${type}')" 
                      class="ml-2 text-gray-500 hover:text-gray-700">×</span>
            </div>
        `)
        .join('');
}

function updateField(schemaType, fieldId, value, type) {
    if (!formData[schemaType]) formData[schemaType] = {};
    
    const validation = validate(value, type);
    const input = document.getElementById(`${schemaType}-${fieldId}`);
    const validationDiv = document.getElementById(`${schemaType}-${fieldId}-validation`);
    
    if (!validation.valid && value !== '') {
        input.classList.add('invalid-field');
        validationDiv.textContent = validation.message;
        return;
    } else {
        input.classList.remove('invalid-field');
        validationDiv.textContent = '';
    }
    
    setNestedValue(formData[schemaType], fieldId, value);
    generateJSON();
}

function createFormSection(title, fields, schemaType) {
    const section = document.createElement('div');
    section.className = 'schema-section';
    
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
        <span class="font-medium">${title}</span>
        <span class="chevron">▶</span>
    `;
    
    const content = document.createElement('div');
    content.className = 'section-content';
    
    fields.forEach(field => {
        if (field.template) {
            // Handle complex templates (like FAQ items)
            const templateContainer = document.createElement('div');
            templateContainer.className = 'array-field';
            templateContainer.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">
                        ${field.label}
                        ${field.required ? '<span class="text-red-500">*</span>' : ''}
                        ${field.tooltip ? `
                            <div class="tooltip">
                                <span>ⓘ</span>
                                <span class="tooltip-text">${field.tooltip}</span>
                            </div>
                        ` : ''}
                    </label>
                    <button onclick="addTemplateItem('${schemaType}', '${field.id}')"
                            class="text-sm text-orange-500 hover:text-orange-600">
                        Add Item
                    </button>
                </div>
                <div id="${schemaType}-${field.id}-container"></div>
            `;
            content.appendChild(templateContainer);
            updateTemplateField(schemaType, field.id, field.template);
        } else if (Array.isArray(field.value)) {
            // Handle array fields
            const arrayContainer = document.createElement('div');
            arrayContainer.className = 'array-field';
            arrayContainer.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">
                        ${field.label}
                        ${field.required ? '<span class="text-red-500">*</span>' : ''}
                        ${field.tooltip ? `
                            <div class="tooltip">
                                <span>ⓘ</span>
                                <span class="tooltip-text">${field.tooltip}</span>
                            </div>
                        ` : ''}
                    </label>
                    <button onclick="addArrayItem('${schemaType}', '${field.id}')"
                            class="text-sm text-orange-500 hover:text-orange-600">
                        Add Item
                    </button>
                </div>
                <div id="${schemaType}-${field.id}-container"></div>
            `;
            content.appendChild(arrayContainer);
            updateArrayField(schemaType, field.id);
        } else {
            // Handle regular fields
            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'mb-4';
            
            const tooltip = field.tooltip ? `
                <div class="tooltip">
                    <span>ⓘ</span>
                    <span class="tooltip-text">${field.tooltip}</span>
                </div>
            ` : '';

            // Get the current value using the path
            let currentValue = '';
            if (formData[schemaType]) {
                currentValue = field.id.includes('.')
                    ? getNestedValue(formData[schemaType], field.id) || ''
                    : formData[schemaType][field.id] || field.default || '';
            }

            fieldDiv.innerHTML = `
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    ${field.label}
                    ${field.required ? '<span class="text-red-500">*</span>' : ''}
                    ${tooltip}
                </label>
                <input type="text" 
                       class="w-full p-2 border border-gray-300 rounded-md" 
                       id="${schemaType}-${field.id}"
                       placeholder="${escapeAttr(field.placeholder || '')}"
                       value="${escapeAttr(currentValue)}"
                       onchange="updateField('${schemaType}', '${field.id}', this.value, '${field.type || ''}')"
                       ${field.required ? 'required' : ''}>
                <div class="validation-message" id="${schemaType}-${field.id}-validation"></div>
            `;
            content.appendChild(fieldDiv);
        }
    });
    
    header.addEventListener('click', () => {
        content.classList.toggle('active');
        header.querySelector('.chevron').classList.toggle('active');
    });
    
    section.appendChild(header);
    section.appendChild(content);
    return section;

function updateSchemaFields() {
    const fieldsContainer = document.getElementById('schemaFields');
    fieldsContainer.innerHTML = '';
    
    activeSchemas.forEach(schemaType => {
        const sections = getSchemaSections(schemaType);

        sections.forEach(section => {

                chevron.classList.add('active');

    generateJSON();

function addTemplateItem(schemaType, fieldId) {
    if (!formData[schemaType]) formData[schemaType] = {};
    if (!formData[schemaType][fieldId]) formData[schemaType][fieldId] = [];

    const newItem = fieldId === 'mainEntity' ? {
        "@type": "Question",
        "acceptedAnswer": {
            "@type": "Answer"
        }
    } : {};
    
    formData[schemaType][fieldId].push(newItem);
    const template = getSchemaSections(schemaType)
        .flatMap(section => section.fields)
        .find(field => field.id === fieldId)?.template || {};
        
    updateTemplateField(schemaType, fieldId, template);
    generateJSON();
}

function updateTemplateField(schemaType, fieldId, template) {
    const container = document.getElementById(`${schemaType}-${fieldId}-container`);
    if (!container) return;

    const items = formData[schemaType]?.[fieldId] || [];
    
    container.innerHTML = items.map((item, index) => {
        const fields = Object.entries(template).map(([key, field]) => `
            <div class="mb-2">

                       class="w-full p-2 border border-gray-300 rounded-md"
                       value="${escapeAttr(getNestedValue(item, field.id) || '')}"
                       onchange="updateTemplateItemField('${schemaType}', '${fieldId}', ${index}, '${field.id}', this.value)">
            </div>
        `).join('');

        return `
            <div class="array-item mb-4 p-4 border border-gray-200 rounded-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-medium">Item ${index + 1}</span>
                    <button onclick="removeTemplateItem('${schemaType}', '${fieldId}', ${index})"

                ${fields}

}

function addArrayItem(schemaType, fieldId) {
    if (!formData[schemaType]) formData[schemaType] = {};
    if (!formData[schemaType][fieldId]) formData[schemaType][fieldId] = [];

    const container = document.getElementById(`${schemaType}-${fieldId}-container`);
    if (!container) return;

function updateArrayItem(schemaType, fieldId, index, value) {
    if (!formData[schemaType]) formData[schemaType] = {};
    if (!formData[schemaType][fieldId]) formData[schemaType][fieldId] = [];
    formData[schemaType][fieldId][index] = value;
    generateJSON();
}

function removeArrayItem(schemaType, fieldId, index) {
    formData[schemaType][fieldId].splice(index, 1);
    updateArrayField(schemaType, fieldId);
    generateJSON();
}

// Build one cleaned schema.org object per active schema (root-level @context/@type).
function buildSchemaObjects() {
    const schemas = [];

    activeSchemas.forEach(schemaType => {
        // Start with the template
        let obj = JSON.parse(JSON.stringify(schemaTemplates[schemaType]));

        // Merge in form data if it exists
        if (formData[schemaType]) {
            const data = formData[schemaType];
            Object.entries(data).forEach(([key, value]) => {
                if (value && (typeof value === 'string' ? value.trim() : value)) {
                    if (Array.isArray(value)) {
                        // Handle array values
                        if (value.length > 0) {
                            setNestedValue(obj, key, value);
                        }
                    } else {
                        setNestedValue(obj, key, value);
                    }
                }
            });
        }

        schemas.push(cleanEmpty(obj));
    });

    return schemas;
}

function generateJSON() {
    const schemas = buildSchemaObjects();

    // Emit valid JSON-LD: a single schema object at root, an array for multiple,
    // and an empty object when nothing is configured yet.
    let output;
    if (schemas.length === 0) {
        output = {};
    } else if (schemas.length === 1) {
        output = schemas[0];
    } else {
        output = schemas;
    }

    const scriptContent = `<script type="application/ld+json">\n${JSON.stringify(output, null, 2)}\n<\/script>`;
    document.getElementById('jsonOutput').textContent = scriptContent;
}
function cleanEmpty(obj) {
    const clean = JSON.parse(JSON.stringify(obj));
    Object.keys(clean).forEach(key => {
        if (clean[key] && typeof clean[key] === 'object') {
            clean[key] = cleanEmpty(clean[key]);
            if (Object.keys(clean[key]).length === 0 || 
                (Array.isArray(clean[key]) && clean[key].length === 0)) {
                delete clean[key];
            }
        } else if (clean[key] === '' || clean[key] === null || clean[key] === undefined) {
            delete clean[key];
        }
    });
    return clean;
}

function getNestedValue(obj, path) {
    return path.split('.').reduce((value, key) => value?.[key], obj);
}

function setNestedValue(obj, path, value) {
    const parts = path.split('.');
    let current = obj;
    
    for (let i = 0; i < parts.length - 1; i++) {
        if (!current[parts[i]]) {
            current[parts[i]] = {};
        }
        current = current[parts[i]];
    }
    
    current[parts[parts.length - 1]] = value;
    return obj;
}

async function validateSchema() {
    const jsonOutput = document.getElementById('jsonOutput');
    const validationResults = document.getElementById('validationResults');
    
    try {
        const jsonContent = jsonOutput.textContent;
        const jsonMatch = jsonContent.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
        
        if (!jsonMatch) {
            throw new Error('Invalid schema format');
        }
        
        const parsed = JSON.parse(jsonMatch[1]);
        // Output is a single object or an array of objects; normalise to an array.
        const schemas = Array.isArray(parsed) ? parsed : [parsed];
        const validationErrors = [];

        schemas.forEach(schema => {
            if (!schema || typeof schema !== 'object' || !schema['@type']) return;
            const schemaKey = schemaKeyForType(schema['@type']);
            if (!schemaKey) return;

            const sections = getSchemaSections(schemaKey);
            const requiredFields = sections
                .flatMap(section => section.fields)
                .filter(field => field.required);

            requiredFields.forEach(field => {
                const fieldPath = field.id.split('.');
                let value = schema;
                for (const part of fieldPath) {
                    value = value?.[part];
                }

                if (!value) {
                    validationErrors.push(`Required field "${field.label}" is missing in the ${schema['@type']} schema`);
                }
            });
        });

        validationResults.style.display = 'block';

        if (validationErrors.length === 0) {
            validationResults.className = 'validation-results validation-success';
            validationResults.innerHTML = `
                <p class="font-semibold">✓ Required fields check passed — validate rich-results eligibility with Google</p>
                <p class="text-sm mt-1">All required fields for the selected type(s) are present. This is a required-field check, not a full schema.org validation — confirm eligibility with the <a href="https://search.google.com/test/rich-results" target="_blank" rel="noopener noreferrer" class="underline font-medium">Google Rich Results Test</a>.</p>
            `;
        } else {
            validationResults.className = 'validation-results validation-error';
            validationResults.innerHTML = `
                <p class="font-semibold">⚠ Required fields check failed</p>
                <ul class="list-disc ml-4 mt-2 text-sm">
                    ${validationErrors.map(error => `<li>${escapeAttr(error)}</li>`).join('')}
                </ul>
                <p class="text-sm mt-2">Once required fields are filled, confirm rich-results eligibility with the <a href="https://search.google.com/test/rich-results" target="_blank" rel="noopener noreferrer" class="underline font-medium">Google Rich Results Test</a>.</p>
            `;
        }
    } catch (error) {
        validationResults.style.display = 'block';
        validationResults.className = 'validation-results validation-error';
        validationResults.innerHTML = `
            <p class="font-semibold">⚠ Required fields check failed</p>
            <p class="text-sm mt-1">Error: ${escapeAttr(error.message)}</p>
        `;
    }
}

        })

function importSchema() {
    document.getElementById('importInput').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const content = e.target.result;
                const jsonMatch = content.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
                const imported = JSON.parse(jsonMatch ? jsonMatch[1] : content);

                // Normalise to a list of schema objects across formats:
                //  - new single-object  → { "@context": ..., "@type": ... }
                //  - new multi (array)  → [ {...}, {...} ]
                //  - legacy wrapped     → { "product": {...}, "article": {...} }  (unwrap known keys)
                let schemaList;
                if (Array.isArray(imported)) {
                    schemaList = imported;
                } else if (imported && imported['@type']) {
                    schemaList = [imported];
                } else if (imported && typeof imported === 'object') {
                    schemaList = Object.keys(imported)
                        .filter(k => schemaTemplates[k])
                        .map(k => imported[k]);
                } else {
                    schemaList = [];
                }

                activeSchemas.clear();
                formData = {};

                schemaList.forEach(schemaObj => {
                    if (!schemaObj || typeof schemaObj !== 'object') return;
                    const schemaKey = schemaKeyForType(schemaObj['@type']);
                    if (schemaKey) {
                        activeSchemas.add(schemaKey);
                        formData[schemaKey] = schemaObj;
                    }
                });

                updateActiveSchemas();
                updateSchemaFields();
                generateJSON();
                showNotification('Schema imported successfully', 'success');
            } catch (error) {
                showNotification('Invalid JSON file', 'error');
            }
        };
        reader.readAsText(file);
    }
}

function exportSchema() {
    const output = document.getElementById('jsonOutput').textContent;
    const blob = new Blob([output], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'schema.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showNotification('Schema exported successfully', 'success');
}

function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.className = `notification ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white`;
    notification.textContent = message;
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.remove();
    }, 3000);
}

<script>
  /* iFrame Resizer — lets Framer auto-size the embed to content height */
  (function () {
    function sendHeight() {
      var h = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      window.parent.postMessage({ type: 'setHeight', height: h }, '*');
      /* Also support iFrameResizer protocol */
      if (window.parentIFrame) { window.parentIFrame.size(h); }
    }
    /* Send on load */
    window.addEventListener('load', sendHeight);
    /* Re-send whenever DOM changes (results appearing, sections expanding) */
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
  })();
</script>
