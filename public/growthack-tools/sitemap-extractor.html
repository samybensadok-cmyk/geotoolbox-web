<script>
/* ===== Part 1/3: Helpers & Networking ===== */
(function () {
  'use strict';
  window.SitemapTool = window.SitemapTool || {};
  const T = window.SitemapTool;

  // First-party fetch proxy — Cloudflare Worker on GrowthAck's OWN domain (see build/proxy/).
  // This is the ONLY server-side dependency in the whole tool, and it's needed solely because
  // browsers can't fetch a cross-origin sitemap (CORS). It lives entirely on Kevin's Cloudflare,
  // so nothing here touches our infra. (Upload path below needs no proxy at all.)
  const GAK_FETCH = 'https://fetch.growthack.io/?url=';

  // Escape user/sitemap-controlled strings before they touch innerHTML.
  T.escapeHtml = function(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  };

  T.sleep = function(ms){ return new Promise(r => setTimeout(r, ms)); };

  T.normalizeUrl = function(raw){
    try{
      const u = new URL(String(raw).trim());
      u.protocol = u.protocol.toLowerCase();
      u.hostname = u.hostname.replace(/^www\./i, '').toLowerCase();
      if ((u.protocol === 'http:' && u.port === '80') || (u.protocol === 'https:' && u.port === '443')) u.port = '';
      const strip = new Set(['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','_hsmi','_hsenc']);
      Array.from(u.searchParams.keys()).forEach(k => { if (strip.has(k.toLowerCase())) u.searchParams.delete(k); });
      u.pathname = u.pathname.replace(/\/{2,}/g,'/');
      if (u.pathname !== '/' && u.pathname.endsWith('/')) u.pathname = u.pathname.slice(0, -1);
      return u.toString();
    }catch(e){ return String(raw).trim(); }
  };

  T.getTags = function(xmlDoc, tag){
    const A = Array.from(xmlDoc.getElementsByTagName(tag));
    const B = xmlDoc.getElementsByTagNameNS ? Array.from(xmlDoc.getElementsByTagNameNS('*', tag)) : [];
    const seen = new Set();
    return [...A, ...B].filter(n => { if (seen.has(n)) return false; seen.add(n); return true; });
  };

  T.parseXml = function(text){
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(text, 'application/xml');
    const err = xmlDoc.getElementsByTagName('parseerror')[0] || xmlDoc.getElementsByTagName('parsererror')[0];
    if (err) throw new Error('Invalid XML: not a valid sitemap file');
    return xmlDoc;
  };

  function fileLooksGzip(file){
    return /\.gz$/i.test(file.name || '') || /gzip|x-gzip|octet-stream/i.test(file.type || '');
  }

  T.readFileAsync = async function(file){
    if (fileLooksGzip(file)){
      const buf = await file.arrayBuffer();
      return pako.ungzip(new Uint8Array(buf), { to: 'string' });
    }
    return await file.text();
  };

  async function attemptFetch(proxyUrl, originalUrl, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(proxyUrl, {
        signal: controller.signal,
        redirect: 'follow',
        cache: 'no-cache'
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      // Handle gzip content
      const ct = res.headers.get('content-type') || '';
      const looksGz = /gzip|octet-stream/i.test(ct) || /\.gz(\?|$)/i.test(originalUrl);
      let text;
      if (looksGz) {
        const buf = await res.arrayBuffer();
        text = pako.ungzip(new Uint8Array(buf), { to: 'string' });
      } else {
        text = await res.text();
      }

      const trimmed = String(text).trim();

      // Reject HTML responses (WAF/interstitial pages)
      if (/^<!doctype html/i.test(trimmed) || /^<html[\s>]/i.test(trimmed)) {
        throw new Error('Got HTML response (WAF or bot protection)');
      }

      // Must parse as valid XML sitemap
      const xmlDoc = T.parseXml(trimmed);
      const hasUrlset  = T.getTags(xmlDoc, 'urlset').length > 0;
      const hasIndex   = T.getTags(xmlDoc, 'sitemapindex').length > 0;
      if (!hasUrlset && !hasIndex) throw new Error('XML loaded but not a recognised sitemap format');

      return trimmed;

    } catch(e) {
      clearTimeout(timer);
      throw e;
    }
  }

  // Map a first-party-proxy JSON error code to an honest, user-facing message.
  T.gakErrorMessage = function(code, status){
    switch (code) {
      case 'blocked_target': return "the server won't fetch that address.";
      case 'bad_url':        return "that doesn't look like a valid sitemap URL.";
      case 'rate_limited':   return "the fetch service is busy right now — wait a minute and try again.";
      case 'too_large':      return "the sitemap is too large to fetch (over 8MB).";
      case 'timeout':        return "the request to the site timed out.";
      default:
        if (/^upstream_(\d+)$/.test(code || '')) return `the site returned HTTP ${code.split('_')[1]}.`;
        return `server said "${code || ('HTTP ' + status)}".`;
    }
  };

  // Decode a proxy/direct response body (gzip-aware) into sitemap XML text,
  // rejecting WAF/interstitial HTML and non-sitemap payloads.
  T.decodeSitemapResponse = async function(res, originalUrl){
    const ct = res.headers.get('content-type') || '';
    const looksGz = /gzip|octet-stream/i.test(ct) || /\.gz(\?|$)/i.test(originalUrl);
    let text;
    if (looksGz) {
      const buf = await res.arrayBuffer();
      text = pako.ungzip(new Uint8Array(buf), { to: 'string' });
    } else {
      text = await res.text();
    }
    const trimmed = String(text).trim();
    if (/^<!doctype html/i.test(trimmed) || /^<html[\s>]/i.test(trimmed)) {
      throw new Error("the server returned a web page instead of a sitemap (it may be blocking automated requests).");
    }
    const xmlDoc = T.parseXml(trimmed);
    const hasUrlset = T.getTags(xmlDoc, 'urlset').length > 0;
    const hasIndex  = T.getTags(xmlDoc, 'sitemapindex').length > 0;
    if (!hasUrlset && !hasIndex) throw new Error("the response wasn't a recognised sitemap format.");
    return trimmed;
  };

  // Fetch via the first-party proxy. Surfaces the contract's JSON errors honestly.
  T.fetchViaGak = async function(url){
    const endpoint = GAK_FETCH + encodeURIComponent(url);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    let res;
    try {
      res = await fetch(endpoint, { signal: controller.signal, cache: 'no-cache' });
    } catch(netErr) {
      clearTimeout(timer);
      throw new Error("Couldn't fetch — the fetch service didn't respond. You can upload the file instead.");
    }
    clearTimeout(timer);

    if (!res.ok) {
      let detail = `server said HTTP ${res.status}.`;
      try {
        const j = await res.json();
        if (j && j.error) detail = T.gakErrorMessage(j.error, res.status);
      } catch(_) { /* non-JSON error body */ }
      throw new Error(`Couldn't fetch — ${detail} You can upload the file instead.`);
    }

    try {
      return await T.decodeSitemapResponse(res, url);
    } catch(decodeErr) {
      throw new Error(`Couldn't fetch — ${decodeErr.message} You can upload the file instead.`);
    }
  };

  // URL-fetch path: try a direct fetch first (permissive-CORS sitemaps),
  // then fall back to the single first-party proxy. No silent failure.
  T.fetchWithProxy = async function(url, onStatus) {
    if (onStatus) onStatus('Fetching…');
    try {
      return await attemptFetch(url, url, 8000);
    } catch(directErr) {
      // Direct fetch blocked by CORS / WAF — route through the first-party proxy.
      return await T.fetchViaGak(url);
    }
  };

})();
</script>

<script>

(function () {
  'use strict';
  const T = window.SitemapTool || (window.SitemapTool = {});

  /* ── Progress Panel controller ── */
  T.PP = (function(){
    let _timerInterval = null;
    let _startTime = 0;
    let _totalSubs = 0;
    let _doneSubs = 0;
    let _urlsFound = 0;

    const panel      = () => document.getElementById('progressPanel');
    const title      = () => document.getElementById('ppTitle');
    const timer      = () => document.getElementById('ppTimer');
    const barFill    = () => document.getElementById('ppBarFill');
    const metaSubs   = () => document.getElementById('ppSitemaps');
    const metaUrls   = () => document.getElementById('ppUrlsFound');

    function formatTime(ms){
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      return `${m}:${String(s % 60).padStart(2,'0')}`;
    }

    function tickTimer(){
      timer().textContent = formatTime(Date.now() - _startTime);
    }

    function setStage(id){
      const stages = ['stage-connect','stage-parse','stage-subs','stage-analyse'];
      const idx = stages.indexOf(id);
      stages.forEach((sid, i) => {
        const el = document.getElementById(sid);
        if (!el) return;
        el.classList.remove('active','done');
        if (i < idx)  el.classList.add('done');
        if (i === idx) el.classList.add('active');
      });
    }

    function setBar(pct){
      const f = barFill();
      if (pct === null){
        f.classList.add('indeterminate');
        f.style.width = '0%';
      } else {
        f.classList.remove('indeterminate');
        f.style.width = Math.min(100, Math.max(0, pct)) + '%';
      }
    }

    return {
      start(){
        _startTime = Date.now();
        _totalSubs = 0; _doneSubs = 0; _urlsFound = 0;
        panel().classList.add('visible');
        title().textContent = 'Connecting to sitemap…';
        timer().textContent = '0:00';
        metaSubs().textContent = '';
        metaUrls().textContent = '';
        setBar(null);
        setStage('stage-connect');
        clearInterval(_timerInterval);
        _timerInterval = setInterval(tickTimer, 500);
      },

      stageParse(){
        title().textContent = 'Parsing XML…';
        setStage('stage-parse');
      },

      stageSubs(total){
        _totalSubs = total;
        title().textContent = `Fetching ${total} sub-sitemap${total !== 1 ? 's' : ''}…`;
        setStage('stage-subs');
        setBar(0);
        metaSubs().innerHTML = `Sub-sitemaps: <span class="accent">0 / ${total}</span>`;
      },

      updateSubs(done, urlsFound){
        _doneSubs = done;
        _urlsFound = urlsFound;
        const pct = _totalSubs ? (done / _totalSubs) * 100 : 0;
        setBar(pct);
        metaSubs().innerHTML = `Sub-sitemaps: <span class="accent">${done} / ${_totalSubs}</span>`;
        metaUrls().innerHTML = `URLs found: <span class="accent">${urlsFound.toLocaleString()}</span>`;
      },

      stageAnalyse(urlCount){
        title().textContent = 'Analysing URLs…';
        setStage('stage-analyse');
        setBar(95);
        metaUrls().innerHTML = `URLs found: <span class="accent">${urlCount.toLocaleString()}</span>`;
      },

      finish(urlCount, hadError){
        clearInterval(_timerInterval);
        tickTimer(); // final time
        const elapsed = formatTime(Date.now() - _startTime);
        if (!hadError){
          title().textContent = `Done — ${urlCount.toLocaleString()} URLs extracted in ${elapsed}`;
          setBar(100);
          // Mark all stages done
          ['stage-connect','stage-parse','stage-subs','stage-analyse'].forEach(sid => {
            const el = document.getElementById(sid);
            if (el){ el.classList.remove('active'); el.classList.add('done'); }
          });
          // Hide spinner
          const sp = panel().querySelector('.pp-spinner');
          if (sp) sp.style.display = 'none';
        } else {
          panel().classList.remove('visible');
        }
      },

      hide(){
        clearInterval(_timerInterval);
        panel().classList.remove('visible');
      }
    };
  })();

  T.findDuplicatesAndNearDuplicates = function(urls){
    const counts = {};
    urls.forEach(u => { counts[u] = (counts[u] || 0) + 1; });
    const exact = Object.entries(counts).filter(([,c]) => c > 1);

    const groups = {};
    urls.forEach(u => {
      try{
        const x = new URL(u);
        const segs = x.pathname.split('/').filter(Boolean);
        const tail = segs.slice(-2).join('/').toLowerCase() || '(root)';
        const keys = [...x.searchParams.keys()].sort().join('&').toLowerCase();
        const key = keys ? `${tail}?${keys}` : tail;
        if (!groups[key]) groups[key] = [];
        groups[key].push(u);
      }catch(_){}
    });

    const near = {};
    Object.entries(groups).forEach(([k, arr]) => {
      const uniq = Array.from(new Set(arr));
      if (uniq.length > 1) near[k] = uniq;
    });

    return { exactDuplicates: exact, nearDuplicates: near };
  };

  T.createDepthChart = function(depthLevels){
    try{
      const el = document.getElementById('depthChart');
      if (!el) return;
      const ctx = el.getContext('2d');
      if (window.depthChart && typeof window.depthChart.destroy === 'function') window.depthChart.destroy();
      window.depthChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(depthLevels).map(d => d === '0' ? 'Homepage' : `${d} levels`),
          datasets: [{ label: 'Number of URLs', data: Object.values(depthLevels) }]
        },
        options: {
          responsive: true,
          plugins: { title: { display: true, text: 'URL Depth Distribution' }, legend: { display: false } },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Number of URLs' } },
            x: { title: { display: true, text: 'Depth Level' } }
          }
        }
      });
    }catch(e){ console.warn('Depth chart error', e); }
  };

  T.createFoldersChart = function(folders){
    try{
      const el = document.getElementById('foldersChart');
      if (!el) return;
      const ctx = el.getContext('2d');
      if (window.foldersChart && typeof window.foldersChart.destroy === 'function') window.foldersChart.destroy();
      const sorted = Object.entries(folders).sort((a,b)=>b[1]-a[1]).slice(0,10);
      window.foldersChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: sorted.map(([f])=>f),
          datasets: [{ data: sorted.map(([,c])=>c) }]
        },
        options: { responsive: true, plugins: { title: { display: true, text: 'Top 10 Folders Distribution' } } }
      });
    }catch(e){ console.warn('Folders chart error', e); }
  };

  // Cap the DOM table on very large sitemaps; the CSV export always has the full list.
  T.MAX_VISIBLE_ROWS = 2000;

  T.displayUrls = function(urls){
    const urlList = document.getElementById('urlList');
    const esc = T.escapeHtml;
    const lm = T.lastmodMap || {};
    const shown = urls.slice(0, T.MAX_VISIBLE_ROWS);
    const capped = urls.length > T.MAX_VISIBLE_ROWS;
    const rows = shown.map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u)}</td><td>${esc(lm[u] || '')}</td></tr>`).join('');
    const notice = capped
      ? `<p class="proxy-status">Showing first ${T.MAX_VISIBLE_ROWS.toLocaleString()} of ${urls.length.toLocaleString()} URLs — download the CSV for the full list.</p>`
      : '';
    urlList.innerHTML = `
      <h2>Extracted URLs (${urls.length.toLocaleString()}):</h2>
      ${notice}
      <div class="scrollable-table">
        <table id="urlTable">
          <thead><tr><th>#</th><th>URL</th><th>Last Modified</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  };

  T.createDuplicateTable = function(dupes){
    const esc = T.escapeHtml;
    return `<table class="duplicate-table">
      <thead><tr><th>URL</th><th>Occurrences</th></tr></thead>
      <tbody>${dupes.map(([u,c])=>`<tr><td>${esc(u)}</td><td>${esc(c)}</td></tr>`).join('')}</tbody>
    </table>`;
  };

  T.createNearDuplicateTable = function(groups){
    const esc = T.escapeHtml;
    return `<table class="duplicate-table">
      <thead><tr><th>Common Ending</th><th>URLs</th></tr></thead>
      <tbody>${Object.entries(groups).map(([k, arr]) => `
        <tr><td>${esc(k)}</td><td><ul>${arr.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></td></tr>
      `).join('')}</tbody>
    </table>`;
  };

  T.analyzeUrls = function(urls){
    T.PP.stageAnalyse(urls.length);
    const statistics = document.getElementById('statistics');
    const duplicates = document.getElementById('duplicates');
    const depthLevels = {};
    const folders = {};

    urls.forEach(u => {
      try{
        const x = new URL(u);
        const segs = x.pathname.split('/').filter(Boolean);
        const depth = segs.length;
        depthLevels[depth] = (depthLevels[depth] || 0) + 1;
        const top = segs[0] || '(root)';
        folders[top] = (folders[top] || 0) + 1;
      }catch(_){
        folders['(invalid)'] = (folders['(invalid)'] || 0) + 1;
      }
    });

    const { exactDuplicates, nearDuplicates } = T.findDuplicatesAndNearDuplicates(urls);
    const exactDuplicateCount = exactDuplicates.reduce((s,[,c]) => s + (c - 1), 0);
    const nearDuplicateCount = Object.values(nearDuplicates).reduce((s,arr) => s + (arr.length - 1), 0);

    statistics.innerHTML = `
      <h2>Sitemap Statistics</h2>
      <div class="stats-container">
        <div class="stat-card"><h3>Total URLs</h3><p>${urls.length}</p></div>
        <div class="stat-card"><h3>Exact Duplicates</h3><p>${exactDuplicateCount}</p></div>
        <div class="stat-card"><h3>Near Duplicates</h3><p>${nearDuplicateCount}</p></div>
      </div>`;

    T.createDepthChart(depthLevels);
    T.createFoldersChart(folders);
    T.displayUrls(urls);

    const exactHtml = exactDuplicates.length
      ? `<h2>Exact Duplicate URLs:</h2><div class="scrollable-table">${T.createDuplicateTable(exactDuplicates)}</div>`
      : '<h2>No exact duplicate URLs found.</h2>';
    const nearHtml = Object.keys(nearDuplicates).length
      ? `<h2>Near-Duplicate URLs:</h2><div class="scrollable-table">${T.createNearDuplicateTable(nearDuplicates)}</div>`
      : '<h2>No near-duplicate URLs found.</h2>';

    duplicates.innerHTML = exactHtml + '<br><br>' + nearHtml;
    T.showResults();
  };

  T.processSitemapContent = async function(xmlDoc, state){
    const urlNodes = T.getTags(xmlDoc, 'url');
    let newOnes = [];

    if (urlNodes.length){
      urlNodes.forEach(n => {
        const loc = T.getTags(n, 'loc')[0];
        if (loc){
          const lm = T.getTags(n, 'lastmod')[0];
          newOnes.push({ loc: loc.textContent.trim(), lastmod: lm ? lm.textContent.trim() : '' });
        }
      });
    } else {
      T.getTags(xmlDoc, 'loc').forEach(l => newOnes.push({ loc: l.textContent.trim(), lastmod: '' }));
    }

    const set = state.set;
    const lm = (T.lastmodMap || (T.lastmodMap = {}));
    newOnes.forEach(rec => {
      const u = String(rec.loc).trim();
      if (!u) return;
      if (!set.has(u)) { state.extracted.push(u); set.add(u); lm[u] = rec.lastmod || ''; }
    });
    state.filtered.length = 0;
    Array.prototype.push.apply(state.filtered, state.extracted);
  };

  // Max levels of nested <sitemapindex> to follow (depth 0 = the entry index).
  T.MAX_INDEX_DEPTH = 3;

  T.processSitemapIndex = async function(xmlDoc, state, onStatus, depth){
    depth = depth || 0;
    const sitemapNodes = T.getTags(xmlDoc, 'sitemap');
    if (!sitemapNodes.length) throw new Error('No sitemaps found in the sitemap index.');

    const urls = sitemapNodes.map(sm => {
      const loc = T.getTags(sm, 'loc')[0];
      return loc ? loc.textContent.trim() : null;
    }).filter(Boolean)
      // Cycle-guard: never fetch a sitemap file we've already visited.
      .filter(u => { if (state.seenSitemaps.has(u)) return false; state.seenSitemaps.add(u); return true; });

    if (!urls.length) {
      if (depth > 0) return; // nested index with nothing new — not fatal
      throw new Error('No valid sitemap URLs found in the index.');
    }

    const total = urls.length;
    if (depth === 0) T.PP.stageSubs(total);

    const CONCURRENCY = 3;
    let i = 0, done = 0;

    async function worker(){
      while (i < urls.length){
        const idx = i++;
        const u = urls[idx];
        try{
          let content = null;
          try {
            content = await T.fetchWithProxy(u, onStatus);
          } catch(fetchErr) {
            console.warn('Sub-sitemap failed:', u, fetchErr.message);
          }
          if (content) {
            const subDoc = T.parseXml(content);
            // A sub-sitemap can itself be a <sitemapindex> — recurse (depth-capped).
            if (T.getTags(subDoc, 'sitemapindex').length > 0) {
              if (depth + 1 < T.MAX_INDEX_DEPTH) {
                await T.processSitemapIndex(subDoc, state, onStatus, depth + 1);
              } else {
                console.warn('Sitemap-index nesting exceeds depth cap, skipping:', u);
              }
            } else {
              await T.processSitemapContent(subDoc, state);
            }
          }
        }catch(e){
          console.warn('Sub-sitemap error:', u, e.message);
        }finally{
          done++;
          if (depth === 0) T.PP.updateSubs(done, state.extracted.length);
        }
      }
    }

    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, total) }, () => worker()));
  };

  T.showResults = function(){
    ['statistics','urlList','duplicates'].forEach(id => document.getElementById(id).classList.remove('hidden'));
    document.querySelectorAll('.chart-container').forEach(el => el.classList.remove('hidden'));
    ['copyBtn','downloadBtn','clearBtn','downloadDuplicatesBtn'].forEach(id => {
      const btn = document.getElementById(id);
      btn.style.display = 'inline-block';
      btn.classList.add('active');
      btn.disabled = false;
    });
  };

  T.showError = function(message){
    // Strip any internal diagnostic lines (proxy names, CORS details etc.)
    const clean = message.split('\n')
      .filter(l => !/^\s*•\s*\[/.test(l) && !/^CORS proxies/i.test(l))
      .join('\n').trim();
    document.getElementById('errorMessage').innerHTML = `
      <div style="background:#fff3f3;padding:15px;border-radius:4px;border-left:4px solid #ff5800;">
        <strong>Error:</strong> ${(T.escapeHtml ? T.escapeHtml(clean) : clean).replace(/\n/g,'<br>')}
        <br><br>
        <small><strong>Tip:</strong> Download the sitemap XML directly in your browser and use the <strong>Upload</strong> option above.</small>
      </div>`;
    document.getElementById('spinner').style.display = 'none';
    ['statistics','urlList','duplicates'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.querySelectorAll('.chart-container').forEach(el => el.classList.add('hidden'));
  };

  T.downloadCSV = function(filtered){
    const lm = T.lastmodMap || {};
    const csv = Papa.unparse([['#','URL','Last Modified'], ...filtered.map((u,i)=>[i+1, u, lm[u] || ''])]);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    link.download = 'extracted_urls.csv';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  };

  T.copyUrls = function(filtered){
    return (filtered || []).join('\n');
  };

  T.downloadDuplicates = function(filtered){
    const { exactDuplicates, nearDuplicates } = T.findDuplicatesAndNearDuplicates(filtered);
    const rows = [['Type','URL','Group/Count']];
    exactDuplicates.forEach(([u,c]) => rows.push(['Exact', u, String(c)]));
    Object.entries(nearDuplicates).forEach(([group, arr]) => arr.forEach(u => rows.push(['Near', u, group])));
    const csv = Papa.unparse(rows);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    link.download = 'duplicate_urls.csv';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  };

})();
</script>

<script>
/* ===== Part 3/3: App wiring & event handlers ===== */
(function () {
  'use strict';
  const T = window.SitemapTool || (window.SitemapTool = {});

  document.addEventListener('DOMContentLoaded', function() {
    const state = { extracted: [], filtered: [], set: new Set(), seenSitemaps: new Set() };

    const fileInput           = document.getElementById('fileInput');
    const urlInput            = document.getElementById('urlInput');
    const filterInput         = document.getElementById('filterInput');
    const fetchBtn            = document.getElementById('fetchBtn');
    const copyBtn             = document.getElementById('copyBtn');
    const downloadBtn         = document.getElementById('downloadBtn');
    const clearBtn            = document.getElementById('clearBtn');
    const downloadDupsBtn     = document.getElementById('downloadDuplicatesBtn');
    const spinner             = document.getElementById('spinner');
    const errorMessage        = document.getElementById('errorMessage');
    const proxyStatus         = document.getElementById('proxyStatus');

    function updateExtractButton(){
      const enabled = fileInput.files.length > 0 || urlInput.value.trim() !== '';
      fetchBtn.style.display = enabled ? 'inline-block' : 'none';
      fetchBtn.classList.toggle('active', enabled);
      fetchBtn.disabled = !enabled;
    }

    function onStatus(msg) {
      // Show generic progress only — no internal proxy/service names
      if (msg.startsWith('✓')) {
        proxyStatus.textContent = ''; // clear on success
      } else {
        proxyStatus.textContent = 'Fetching…';
      }
    }

    async function fetchSitemap(){
      errorMessage.textContent = '';
      proxyStatus.textContent = '';
      spinner.style.display = 'none';
      fetchBtn.disabled = true;
      state.extracted = []; state.filtered = []; state.set = new Set(); state.seenSitemaps = new Set();
      T.lastmodMap = {};

      T.PP.start();

      let hadError = false;
      try{
        let content;
        if (fileInput.files.length > 0){
          T.PP.stageParse();
          content = await T.readFileAsync(fileInput.files[0]);
        } else if (urlInput.value.trim()){
          const targetUrl = urlInput.value.trim();
          // Direct fetch first, then the first-party proxy. Errors surface honestly.
          content = await T.fetchWithProxy(targetUrl, onStatus);
          T.PP.stageParse();
        } else {
          throw new Error('Please either upload a file or enter a sitemap URL.');
        }

        const xmlDoc = T.parseXml(content);
        const isIndex = T.getTags(xmlDoc, 'sitemapindex').length > 0;

        if (isIndex){
          await T.processSitemapIndex(xmlDoc, state, onStatus);
        } else {
          await T.processSitemapContent(xmlDoc, state);
        }

        if (state.extracted.length === 0) throw new Error('No URLs found in the sitemap.');

        proxyStatus.textContent = '';
        T.analyzeUrls(state.extracted);

      }catch(err){
        hadError = true;
        console.error('Error:', err);
        T.showError(err.message);
      }finally{
        T.PP.finish(state.extracted.length, hadError);
        fetchBtn.disabled = false;
        updateExtractButton();
      }
    }

    let filterTimer;
    function filterUrls(){
      const text = filterInput.value.toLowerCase().trim();
      clearTimeout(filterTimer);
      filterTimer = setTimeout(()=>{
        state.filtered = state.extracted.filter(u => u.toLowerCase().includes(text));
        T.analyzeUrls(state.filtered);
      }, 250);
    }

    function clearResults(){
      state.extracted = []; state.filtered = []; state.set = new Set(); state.seenSitemaps = new Set();
      T.lastmodMap = {};
      fileInput.value = ''; urlInput.value = ''; filterInput.value = '';
      proxyStatus.textContent = '';
      ['statistics','urlList','duplicates'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.chart-container').forEach(el => el.classList.add('hidden'));
      ['copyBtn','downloadBtn','clearBtn','downloadDuplicatesBtn'].forEach(id => {
        const btn = document.getElementById(id);
        btn.style.display = 'none'; btn.classList.remove('active'); btn.disabled = true;
      });
      errorMessage.textContent = '';
      T.PP.hide();
      if (window.depthChart?.destroy) { window.depthChart.destroy(); window.depthChart = null; }
      if (window.foldersChart?.destroy) { window.foldersChart.destroy(); window.foldersChart = null; }
      updateExtractButton();
    }

    fileInput.addEventListener('change', () => { urlInput.value = ''; updateExtractButton(); });
    urlInput.addEventListener('input', () => { fileInput.value = ''; updateExtractButton(); });
    filterInput.addEventListener('input', filterUrls);
    fetchBtn.addEventListener('click', e => { e.preventDefault(); if (!fetchBtn.disabled) fetchSitemap(); });
    copyBtn.addEventListener('click', async e => {
      e.preventDefault();
      if (!copyBtn.classList.contains('active')) return;
      const list = state.filtered.length ? state.filtered : state.extracted;
      const textOut = T.copyUrls(list);
      const original = copyBtn.textContent;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(textOut);
        } else {
          const ta = document.createElement('textarea');
          ta.value = textOut; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        }
        copyBtn.textContent = `Copied ${list.length.toLocaleString()} URLs!`;
      } catch(_) {
        copyBtn.textContent = 'Copy failed — select manually';
      }
      setTimeout(() => { copyBtn.textContent = original; }, 2000);
    });
    downloadBtn.addEventListener('click', e => { e.preventDefault(); if (downloadBtn.classList.contains('active')) T.downloadCSV(state.filtered.length ? state.filtered : state.extracted); });
    clearBtn.addEventListener('click', e => { e.preventDefault(); if (clearBtn.classList.contains('active')) clearResults(); });
    downloadDupsBtn.addEventListener('click', e => { e.preventDefault(); if (downloadDupsBtn.classList.contains('active')) T.downloadDuplicates(state.filtered.length ? state.filtered : state.extracted); });

    updateExtractButton();
  });
})();
</script>

<script>
  /* iFrame Resizer — lets Framer auto-size the embed to content height */
  (function () {
    function sendHeight() {
      var h = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      window.parent.postMessage({ type: 'setHeight', height: h }, '*');
      /* Also support iFrameResizer protocol */
      if (window.parentIFrame) { window.parentIFrame.size(h); }
    }
    /* Send on load */
    window.addEventListener('load', sendHeight);
    /* Re-send whenever DOM changes (results appearing, sections expanding) */
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
  })();
</script>
