<body>
    <div class="robots-generator-tool">
        <div class="container">

<script>
    let rules = [];
    
const robotTypes = {
    'Universal': 'User-agent: *',
    'Search Engines': {
        'Googlebot': 'User-agent: Googlebot',
        'Bingbot': 'User-agent: Bingbot',
        'DuckDuckBot': 'User-agent: DuckDuckBot',
        'Yandex': 'User-agent: Yandex'
    },
    'AI Training Crawlers': {
        'GPTBot (OpenAI)': 'User-agent: GPTBot',
        'ClaudeBot (Anthropic)': 'User-agent: ClaudeBot',
        'Google-Extended (Google AI)': 'User-agent: Google-Extended',
        'Applebot-Extended (Apple)': 'User-agent: Applebot-Extended',
        'CCBot (Common Crawl)': 'User-agent: CCBot',
        'Bytespider (ByteDance)': 'User-agent: Bytespider',
        'Meta-ExternalAgent (Meta)': 'User-agent: Meta-ExternalAgent',
        'cohere-ai (Cohere)': 'User-agent: cohere-ai',
        'Amazonbot (Amazon)': 'User-agent: Amazonbot'
    },
    'AI Search / Retrieval': {
        'OAI-SearchBot (ChatGPT Search)': 'User-agent: OAI-SearchBot',
        'ChatGPT-User (ChatGPT browsing)': 'User-agent: ChatGPT-User',
        'Claude-SearchBot (Claude Search)': 'User-agent: Claude-SearchBot',
        'Claude-User (Claude browsing)': 'User-agent: Claude-User',
        'PerplexityBot (Perplexity)': 'User-agent: PerplexityBot',
        'Perplexity-User (Perplexity fetch)': 'User-agent: Perplexity-User'
    },
    'Social Media': {
        'Twitterbot': 'User-agent: Twitterbot',
        'FacebookBot': 'User-agent: facebookexternalhit',
        'LinkedInBot': 'User-agent: LinkedInBot',
        'PinterestBot': 'User-agent: Pinterest'
    }
};

// Rule Creation and Management
function createRuleElement(index) {
    const rule = document.createElement('div');
    rule.className = 'rule';
    
    let userAgentSelect = '<select onchange="updateOutput()" data-index="' + index + '">';
    for (const [group, items] of Object.entries(robotTypes)) {
        if (typeof items === 'string') {
            userAgentSelect += `<option value="${items}">${group}</option>`;
        } else {
            userAgentSelect += `<optgroup label="${group}">`;
            for (const [name, value] of Object.entries(items)) {
                userAgentSelect += `<option value="${value}">${name}</option>`;
            }
            userAgentSelect += '</optgroup>';
        }
    }
    userAgentSelect += '</select>';

    rule.innerHTML = `
        ${userAgentSelect}
        <select onchange="updateOutput()" data-index="${index}">
            <option value="Allow: ">Allow</option>
            <option value="Disallow: ">Disallow</option>
            <option value="Crawl-delay: ">Crawl-delay</option>
        </select>
        <input type="text" placeholder="/path/ or delay in seconds" onkeyup="updateOutput()" data-index="${index}">
        <button class="remove" onclick="removeRule(${index})" title="Remove Rule">
            <span class="button-icon">🗑️</span>
        </button>
    `;
    return rule;
}

function addRule() {
    const index = rules.length;
    rules.push({
        userAgent: 'User-agent: *',
        directive: 'Allow: ',
        path: ''
    });
    const ruleElement = createRuleElement(index);
    document.getElementById('rulesContainer').appendChild(ruleElement);
    updateOutput();
    validateRules();
    showMessage('New rule added', 'success');
}

function addCommonRules() {
    const commonRules = [
        { userAgent: 'User-agent: *', directive: 'Disallow: ', path: '/admin/' },
        { userAgent: 'User-agent: *', directive: 'Disallow: ', path: '/private/' },
        { userAgent: 'User-agent: *', directive: 'Disallow: ', path: '/wp-admin/' },
        { userAgent: 'User-agent: GPTBot', directive: 'Disallow: ', path: '/' },
        { userAgent: 'User-agent: ClaudeBot', directive: 'Disallow: ', path: '/' },
        { userAgent: 'User-agent: CCBot', directive: 'Disallow: ', path: '/' }
    ];

    // Add common rules to the existing rules array
    rules.push(...commonRules);
    
    // Refresh the rules display
    refreshRules();
    
    // Update the output and validate
    updateOutput();
    
    // Show success message
    showMessage(`Added ${commonRules.length} common rules`, 'success');
}

function removeRule(index) {
    rules.splice(index, 1);
    refreshRules();
    updateOutput();
    showMessage('Rule removed', 'success');
}

function refreshRules() {
    const container = document.getElementById('rulesContainer');
    container.innerHTML = '';
    rules.forEach((rule, index) => {
        const ruleElement = createRuleElement(index);
        
        // Set the values for the newly created rule element
        const selects = ruleElement.getElementsByTagName('select');
        const input = ruleElement.getElementsByTagName('input')[0];
        
        // Set user agent
        selects[0].value = rule.userAgent;
        
        // Set directive
        selects[1].value = rule.directive;
        
        // Set path
        input.value = rule.path;
        
        container.appendChild(ruleElement);
    });
}

// Validation
function validateRules() {
    const validationMessages = [];
    const paths = new Set();
    let hasLLMProtection = false;

    rules.forEach((rule, index) => {
        if (rule.directive !== 'Crawl-delay: ') {
            // Path format validation
            if (!rule.path.startsWith('/') && rule.path !== '' && !rule.path.startsWith('*')) {
                validationMessages.push({
                    type: 'error',
                    message: `Path "${rule.path}" should start with / or *`
                });
            }

            // Invalid characters check
            if (/[<>"|]/.test(rule.path)) {
                validationMessages.push({
                    type: 'error',
                    message: `Invalid characters found in path "${rule.path}"`
                });
            }

            // Duplicate rules check
            const ruleKey = `${rule.userAgent}-${rule.path}`;
            if (paths.has(ruleKey)) {
                validationMessages.push({
                    type: 'warning',
                    message: `Duplicate rule found for "${rule.path}" with ${rule.userAgent}`
                });
            }
            paths.add(ruleKey);

            // Check for LLM protection
            if (rule.userAgent.includes('GPTBot') || rule.userAgent.includes('ClaudeBot') ||
                rule.userAgent.includes('CCBot')) {
                hasLLMProtection = true;
            }
        } else {
            // Crawl-delay validation
            if (isNaN(rule.path)) {
                validationMessages.push({
                    type: 'error',
                    message: 'Crawl-delay value must be a number'
                });
            }
        }
    });

    // Suggest LLM protection if not present
    if (!hasLLMProtection) {
        validationMessages.push({
            type: 'warning',
            message: 'Consider adding protection against AI crawlers (GPTBot, ClaudeBot, CCBot)'
        });
    }

    displayValidation(validationMessages);
    return validationMessages.filter(m => m.type === 'error').length === 0;
}

function displayValidation(messages) {
    const container = document.getElementById('validationMessages');
    container.innerHTML = '';

    messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `validation-message validation-${msg.type}`;
        div.textContent = msg.message;
        container.appendChild(div);
    });
}

// Pattern Builder
function updatePattern() {
    const type = document.getElementById('patternType').value;
    const input = document.getElementById('patternInput').value;
    let pattern = '';

    switch(type) {
        case 'exact':
            pattern = '/' + input.replace(/^\/+/, '');
            break;
        case 'startsWith':
            pattern = '/' + input.replace(/^\/+/, '') + '*';
            break;
        case 'endsWith':
            // robots.txt "ends with" uses the $ end-of-URL anchor: *suffix$
            pattern = '*' + input.replace(/^\*+/, '').replace(/\$+$/, '') + '$';
            break;
        case 'contains':
            // robots.txt "contains" wraps the term in wildcards: *term*
            pattern = '*' + input.replace(/^\*+/, '').replace(/\*+$/, '') + '*';
            break;
    }

    document.getElementById('patternPreview').textContent = pattern;
}

function addPatternRule() {
    const pattern = document.getElementById('patternPreview').textContent;
    const patternType = document.getElementById('patternType').value;
    const patternInput = document.getElementById('patternInput').value;

    if (!patternInput) {
        showMessage('Please enter a pattern', 'error');
        return;
    }

    // Add the new pattern rule
    rules.push({
        userAgent: 'User-agent: *',
        directive: 'Disallow: ',
        path: pattern
    });

    // Refresh the rules display
    refreshRules();

    // Update the output
    updateOutput();

    // Switch back to the editor tab
    switchTab('editor');

    // Show success message
    showMessage(`Added ${patternType} pattern rule: ${pattern}`, 'success');
}

// Testing
function testUrl() {
    const url = document.getElementById('testUrl').value;
    const userAgent = document.getElementById('testUserAgent').value;
    
    if (!url) {
        showMessage('Please enter a URL to test', 'error');
        return;
    }

    const result = checkAccess(url, userAgent);
    const resultDiv = document.getElementById('testResult');
    resultDiv.className = `validation-message validation-${result.allowed ? 'success' : 'error'}`;
    resultDiv.textContent = result.message;
}

function bulkTest() {
    const urls = document.getElementById('bulkUrls').value.split('\n');
    const userAgent = document.getElementById('testUserAgent').value;
    
    if (!urls[0]) {
        showMessage('Please enter URLs to test', 'error');
        return;
    }

    const results = urls.map(url => {
        url = url.trim();
        if (!url) return null;
        const result = checkAccess(url, userAgent);
        return { url, result };
    }).filter(Boolean);

    displayBulkResults(results);
}

function displayBulkResults(results) {
    const resultsDiv = document.getElementById('bulkTestResults');
    resultsDiv.innerHTML = `
        <h4>Test Results (${results.length} URLs)</h4>
        ${results.map(({url, result}) => `
            <div class="validation-message validation-${result.allowed ? 'success' : 'error'}">
                ${url}: ${result.message}
            </div>
        `).join('')}
    `;
}

function checkAccess(url, userAgent) {
    try {
        const path = new URL(url).pathname;

        // Only Allow/Disallow directives affect access resolution.
        const directiveRules = rules.filter(r =>
            r.directive === 'Allow: ' || r.directive === 'Disallow: ');

        // RFC 9309: a crawler obeys the single most-specific matching group.
        // If a group is named for this user agent, the '*' group is ignored
        // entirely. UA token matching is case-insensitive.
        const ua = (userAgent || '').toLowerCase();
        let group = directiveRules.filter(r =>
            (r.userAgent.split(': ')[1] || '').toLowerCase() === ua);
        if (group.length === 0) {
            group = directiveRules.filter(r =>
                (r.userAgent.split(': ')[1] || '') === '*');
        }

        // Longest matching path wins; Allow wins on an equal-length tie.
        let best = null; // { allowed, len, rule }
        for (const rule of group) {
            if (!pathMatches(path, rule.path)) continue;
            const len = rule.path.length;
            const isAllow = rule.directive === 'Allow: ';
            if (best === null ||
                len > best.len ||
                (len === best.len && isAllow && !best.allowed)) {
                best = { allowed: isAllow, len, rule };
            }
        }

        const allowed = best ? best.allowed : true;
        const matchingRule = best ? `${best.rule.directive}${best.rule.path}` : '';

        return {
            allowed,
            message: allowed
                ? `✓ URL is allowed for ${userAgent}` +
                  (matchingRule ? ` (rule: ${matchingRule})` : ' (no matching rule)')
                : `✗ URL is blocked for ${userAgent} by rule: ${matchingRule}`
        };
    } catch (e) {
        return {
            allowed: false,
            message: '✗ Invalid URL format'
        };
    }
}

// robots.txt path matching: '*' = any sequence, trailing '$' = end-of-URL
// anchor, otherwise a prefix match. No other special characters.
function pathMatches(urlPath, rulePath) {
    if (!rulePath) return false;

    let anchorEnd = false;
    let p = rulePath;
    if (p.endsWith('$')) {
        anchorEnd = true;
        p = p.slice(0, -1);
    }

    let re = '';
    for (const ch of p) {
        re += ch === '*' ? '.*' : ch.replace(/[.+?^${}()|[\]\\]/g, '\\$&');
    }
    const pattern = '^' + re + (anchorEnd ? '$' : '');

    try {
        return new RegExp(pattern).test(urlPath);
    } catch (e) {
        return false;
    }
}

// Output Generation
function updateOutput() {
    const elements = document.getElementById('rulesContainer').children;
    rules = [];
    
    for (let i = 0; i < elements.length; i++) {
        const selects = elements[i].getElementsByTagName('select');
        const input = elements[i].getElementsByTagName('input')[0];
        
        rules.push({
            userAgent: selects[0].value,
            directive: selects[1].value,
            path: input.value
        });
    }

    let output = '# robots.txt generated ' + new Date().toISOString().split('T')[0] + '\n';
    output += '# Enhanced with LLM crawler protection\n\n';
    
    let currentUserAgent = '';
    
    rules.forEach(rule => {
        if (currentUserAgent !== rule.userAgent) {
            output += '\n' + rule.userAgent + '\n';
            currentUserAgent = rule.userAgent;
        }
        output += rule.directive + rule.path + '\n';
    });

    output += emitSitemaps();

    document.getElementById('output').textContent = output;
    validateRules();
}

// Sitemap directive: global (not tied to a user-agent group), appended last.
function emitSitemaps() {
    const el = document.getElementById('sitemapUrls');
    if (!el) return '';

    const lines = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    const valid = [];
    const invalid = [];

    lines.forEach(line => {
        (isValidSitemapUrl(line) ? valid : invalid).push(line);
    });

    const msgContainer = document.getElementById('sitemapValidation');
    if (msgContainer) {
        msgContainer.innerHTML = '';
        invalid.forEach(u => {
            const div = document.createElement('div');
            div.className = 'validation-message validation-error';
            div.textContent = `Invalid sitemap URL (must be a full http(s) URL): ${u}`;
            msgContainer.appendChild(div);
        });
    }

    if (valid.length === 0) return '';
    return '\n' + valid.map(u => 'Sitemap: ' + u).join('\n') + '\n';
}

function isValidSitemapUrl(url) {
    try {
        const u = new URL(url);
        return u.protocol === 'http:' || u.protocol === 'https:';
    } catch (e) {
        return false;
    }
}

// Utility Functions
function copyToClipboard() {
    const output = document.getElementById('output');
    navigator.clipboard.writeText(output.textContent)
        .then(() => showMessage('Copied to clipboard!', 'success'))
        .catch(() => showMessage('Failed to copy. Please try manually.', 'error'));
}

function downloadRobotsTxt() {
    const content = document.getElementById('output').textContent;
    const blob = new Blob([content], { type: 'text/plain' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'robots.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);
    showMessage('robots.txt downloaded', 'success');
}

function showMessage(message, type) {
    const container = document.getElementById('validationMessages');
    const div = document.createElement('div');
    div.className = `validation-message validation-${type}`;
    div.textContent = message;
    container.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

// Tab Management
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
    });

    document.getElementById(tabId).classList.add('active');
    document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    addRule();
});
</script>

<script>
  /* iFrame Resizer — lets Framer auto-size the embed to content height */
  (function () {
    function sendHeight() {
      var h = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      window.parent.postMessage({ type: 'setHeight', height: h }, '*');
      /* Also support iFrameResizer protocol */
      if (window.parentIFrame) { window.parentIFrame.size(h); }
    }
    /* Send on load */
    window.addEventListener('load', sendHeight);
    /* Re-send whenever DOM changes (results appearing, sections expanding) */
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
  })();
</script>
