        <div class="container">

    <script>
    let roiChart;
    let currentScenario = 'realistic';

    // Initialize the calculator
    document.addEventListener('DOMContentLoaded', function() {
        setupInputFormatting();
        validateAllInputs();
        setupTooltips();
    });

    function setupInputFormatting() {
        const numericInputs = document.querySelectorAll('input[type="text"]');
        numericInputs.forEach(input => {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^0-9.]/g, '');
                
                // Handle decimal points
                const decimalCount = (value.match(/\./g) || []).length;
                if (decimalCount > 1) {
                    value = value.slice(0, value.lastIndexOf('.'));
                }

                // Format with commas
                if (value) {
                    const parts = value.split('.');
                    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                    value = parts.join('.');
                }

                e.target.value = value;
                validateAllInputs();
            });

            // Add focus effects
            input.addEventListener('focus', function() {
                this.style.borderColor = '#ff5800';
                this.style.boxShadow = '0 0 0 2px rgba(255, 88, 0, 0.1)';
            });
            
            input.addEventListener('blur', function() {
                this.style.borderColor = '#e0e0e0';
                this.style.boxShadow = 'none';
            });
        });
    }

    function validateAllInputs() {
        const inputs = [
            'currentTraffic',
            'trafficIncrease',
            'conversionRate',
            'averageOrderValue',
            'seoCost',
            'months'
        ];

        const calculateBtn = document.getElementById('calculateBtn');
        const allValid = inputs.every(id => {
            const value = document.getElementById(id).value.replace(/,/g, '');
            return value && !isNaN(parseFloat(value));
        });

        calculateBtn.disabled = !allValid;
    }

    function setupTooltips() {
        const tooltips = document.querySelectorAll('.info-tooltip');

        const showTooltip = (tooltip, content) => {
            content.style.display = 'block';
            // Reset then reposition if it would run off the right edge
            content.style.left = '0';
            content.style.right = 'auto';
            const rect = tooltip.getBoundingClientRect();
            const contentRect = content.getBoundingClientRect();
            if (rect.left + contentRect.width > window.innerWidth) {
                content.style.left = 'auto';
                content.style.right = '0';
            }
        };
        const hideTooltip = (content) => {
            content.style.display = 'none';
        };

        tooltips.forEach(tooltip => {
            const content = tooltip.querySelector('.tooltip-content');
            // Make focusable so keyboard + tap can trigger it
            tooltip.setAttribute('tabindex', '0');

            tooltip.addEventListener('mouseenter', () => showTooltip(tooltip, content));
            tooltip.addEventListener('mouseleave', () => hideTooltip(content));
            tooltip.addEventListener('focus', () => showTooltip(tooltip, content));
            tooltip.addEventListener('blur', () => hideTooltip(content));

            // Tap / click toggles (mobile + touch where hover is unavailable)
            tooltip.addEventListener('click', (e) => {
                e.stopPropagation();
                if (content.style.display === 'block') {
                    hideTooltip(content);
                } else {
                    // Close any other open tooltips first
                    document.querySelectorAll('.tooltip-content').forEach(hideTooltip);
                    showTooltip(tooltip, content);
                }
            });
        });

        // Tap outside closes any open tooltip
        document.addEventListener('click', () => {
            document.querySelectorAll('.tooltip-content').forEach(hideTooltip);
        });
    }

    function calculateROI() {
        const inputs = getFormattedInputs();
        const errorMessage = document.getElementById('errorMessage');

        const validationError = validateInputs(inputs);
        if (!validationError) {
            errorMessage.style.display = 'none';
            const projections = calculateRealisticProjections(
                inputs.currentTraffic,
                inputs.trafficIncrease/100, // Convert percentage to decimal
                inputs.conversionRate/100,  // Convert percentage to decimal
                inputs.averageOrderValue,
                inputs.seoCost,
                inputs.months
            );
            
            if (projections && projections.length > 0) {
                displayResults(projections);
                document.getElementById('chartContainer').classList.remove('hidden');
                document.getElementById('clearBtn').classList.remove('hidden');
                updateChart(projections);
            } else {
                errorMessage.textContent = 'Error calculating projections. Please check your inputs.';
                errorMessage.style.display = 'block';
            }
        } else {
            errorMessage.textContent = validationError;
            errorMessage.style.display = 'block';
        }
    }

    function getFormattedInputs() {
        return {
            currentTraffic: parseFloat(document.getElementById('currentTraffic').value.replace(/,/g, '')),
            trafficIncrease: parseFloat(document.getElementById('trafficIncrease').value.replace(/,/g, '')),
            conversionRate: parseFloat(document.getElementById('conversionRate').value.replace(/,/g, '')),
            averageOrderValue: parseFloat(document.getElementById('averageOrderValue').value.replace(/,/g, '')),
            seoCost: parseFloat(document.getElementById('seoCost').value.replace(/,/g, '')),
            months: parseInt(document.getElementById('months').value.replace(/,/g, ''))
        };
    }

    // Returns null when all inputs are valid, or a friendly per-field error string
    // naming the offending field and its allowed range.
    function validateInputs(inputs) {
        const rules = {
            currentTraffic:    { label: 'Current Monthly Organic Traffic', min: 1,    max: 100000000, unit: ' visits' },
            trafficIncrease:   { label: '% Estimated Traffic Increase',    min: 1,    max: 500,       unit: '%' },
            conversionRate:    { label: '% Average Conversion Rate',       min: 0.01, max: 100,       unit: '%' },
            averageOrderValue: { label: '£ Average Order Value',           min: 0.01, max: 1000000,   unit: '' },
            seoCost:           { label: '£ Monthly SEO Investment',        min: 1,    max: 1000000,   unit: '' },
            months:            { label: 'Projection Period (Months)',      min: 1,    max: 60,        unit: '' }
        };

        for (const [key, rule] of Object.entries(rules)) {
            const value = inputs[key];
            if (isNaN(value)) {
                return `${rule.label}: please enter a valid number.`;
            }
            if (value < rule.min || value > rule.max) {
                return `${rule.label} must be between ${numberWithCommas(rule.min)} and ${numberWithCommas(rule.max)}${rule.unit}.`;
            }
        }
        return null;
    }

    function calculateRealisticProjections(currentTraffic, trafficIncrease, conversionRate, averageOrderValue, seoCost, months) {
        let projections = [];
        let cumulativeCost = 0;
        let cumulativeRevenue = 0;

        for (let i = 0; i < months; i++) {
            let monthsSinceStart = i + 1;
            let growthFactor;

            if (currentScenario === 'best') {
                if (monthsSinceStart <= 1) {
                    growthFactor = 0;
                } else if (monthsSinceStart <= 6) {
                    growthFactor = (monthsSinceStart - 1) / 5;
                } else {
                    growthFactor = Math.min(1, (monthsSinceStart - 6) / 6 + 1);
                }
            } else if (currentScenario === 'worst') {
                if (monthsSinceStart <= 5) {
                    growthFactor = 0;
                } else if (monthsSinceStart <= 12) {
                    growthFactor = (monthsSinceStart - 5) / 7 * 0.5;
                } else {
                    growthFactor = Math.min(1, 0.5 + (monthsSinceStart - 12) / 12 * 0.5);
                }
            } else { // realistic
                if (monthsSinceStart <= 3) {
                    growthFactor = 0;
                } else if (monthsSinceStart <= 6) {
                    growthFactor = Math.pow((monthsSinceStart - 3) / 3, 2) * 0.1;
                } else if (monthsSinceStart <= 12) {
                    growthFactor = 0.1 + (monthsSinceStart - 6) / 6 * 0.4;
                } else {
                    growthFactor = Math.min(1, 0.5 + (monthsSinceStart - 12) / 12 * 0.5);
                }
            }

            let monthlyTraffic = currentTraffic * (1 + (trafficIncrease * growthFactor));
            let additionalTraffic = monthlyTraffic - currentTraffic;
            let additionalConversions = additionalTraffic * conversionRate;
            let additionalRevenue = additionalConversions * averageOrderValue;

            cumulativeCost += seoCost;
            cumulativeRevenue += additionalRevenue;

            projections.push({
                month: monthsSinceStart,
                traffic: monthlyTraffic,
                additionalTraffic: additionalTraffic,
                additionalConversions: additionalConversions,
                additionalRevenue: additionalRevenue,
                cumulativeCost: cumulativeCost,
                cumulativeRevenue: cumulativeRevenue,
                roi: ((cumulativeRevenue - cumulativeCost) / cumulativeCost) * 100
            });
        }

        return projections;
    }

    function displayResults(projections) {
        const resultContent = document.getElementById('resultContent');
        const lastMonth = projections[projections.length - 1];

        // Breakeven = first month where cumulative revenue catches up to cumulative cost.
        const breakeven = projections.find(p => p.cumulativeRevenue >= p.cumulativeCost);
        const breakevenItem = breakeven
            ? `<div class="result-item">
                <strong>Estimated Breakeven:</strong>
                <span class="highlight-value">Month ${breakeven.month}</span>
            </div>`
            : `<div class="result-item">
                <strong>Estimated Breakeven:</strong>
                <span class="highlight-value">No breakeven within the selected period — consider a longer timeframe</span>
            </div>`;

        resultContent.innerHTML = breakevenItem + `
            <div class="result-item">
                <strong>Final Monthly Traffic:</strong> 
                <span class="highlight-value">${numberWithCommas(Math.round(lastMonth.traffic))} visitors</span>
            </div>
            <div class="result-item">
                <strong>Additional Monthly Conversions:</strong> 
                <span class="highlight-value">${numberWithCommas(lastMonth.additionalConversions.toFixed(0))}</span>
            </div>
            <div class="result-item">
                <strong>Additional Monthly Revenue:</strong> 
                <span class="highlight-value">£${numberWithCommas(lastMonth.additionalRevenue.toFixed(2))}</span>
            </div>
            <div class="result-item">
                <strong>Total SEO Investment:</strong> 
                <span class="highlight-value">£${numberWithCommas(lastMonth.cumulativeCost.toFixed(2))}</span>
            </div>
            <div class="result-item">
                <strong>Total Additional Revenue:</strong> 
                <span class="highlight-value">£${numberWithCommas(lastMonth.cumulativeRevenue.toFixed(2))}</span>
            </div>
            <div class="result-item">
                <strong>Return on Investment:</strong> 
                <span class="highlight-value">${numberWithCommas(lastMonth.roi.toFixed(2))}%</span>
            </div>
        `;

        document.getElementById('results').style.display = 'block';
    }

    function updateChart(projections) {
        const ctx = document.getElementById('roiChart').getContext('2d');

        if (roiChart) {
            roiChart.destroy();
        }

        const labels = projections.map(p => `Month ${p.month}`);
        const revenueData = projections.map(p => p.cumulativeRevenue);
        const costData = projections.map(p => p.cumulativeCost);

        roiChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Cumulative Revenue',
                        data: revenueData,
                        borderColor: '#FF5800',
                        backgroundColor: 'rgba(255, 88, 0, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Cumulative SEO Investment',
                        data: costData,
                        borderColor: '#133b4f',
                        backgroundColor: 'rgba(19, 59, 79, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                family: "'Inter', sans-serif",
                                size: 12
                            },
                            usePointStyle: true,
                            padding: 20
                        }
                    },
                    tooltip: {
                        backgroundColor: '#ffffff',
                        titleColor: '#133b4f',
                        titleFont: {
                            family: "'Inter', sans-serif",
                            size: 14,
                            weight: '600'
                        },
                        bodyColor: '#133b4f',
                        bodyFont: {
                            family: "'Inter', sans-serif",
                            size: 13
                        },
                        borderColor: '#e0e0e0',
                        borderWidth: 1,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += new Intl.NumberFormat('en-GB', { 
                                        style: 'currency', 
                                        currency: 'GBP' 
                                    }).format(context.parsed.y);
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        ticks: {
                            callback: function(value) {
                                return '£' + new Intl.NumberFormat('en-GB').format(value);
                            },
                            font: {
                                family: "'Inter', sans-serif",
                                size: 12
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            font: {
                                family: "'Inter', sans-serif",
                                size: 12
                            }
                        }
                    }
                }
            }
        });
    }

    function clearResults() {
        document.querySelectorAll('input[type="text"]').forEach(input => {
            if (input.id !== 'months') {
                input.value = '';
            } else {
                input.value = '24';
            }
        });
        
        document.getElementById('scenario').value = 'realistic';
        currentScenario = 'realistic';
        
        document.getElementById('results').style.display = 'none';
        document.getElementById('chartContainer').classList.add('hidden');
        document.getElementById('clearBtn').classList.add('hidden');
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('calculateBtn').disabled = true;
        
        if (roiChart) {
            roiChart.destroy();
            roiChart = null;
        }
    }

    function toggleScenario(scenario) {
        currentScenario = scenario;
        if (document.getElementById('results').style.display === 'block') {
            calculateROI();
        }
    }

    function numberWithCommas(x) {
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
</script>

<script>
  /* iFrame Resizer — lets Framer auto-size the embed to content height */
  (function () {
    function sendHeight() {
      var h = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      window.parent.postMessage({ type: 'setHeight', height: h }, '*');
      /* Also support iFrameResizer protocol */
      if (window.parentIFrame) { window.parentIFrame.size(h); }
    }
    /* Send on load */
    window.addEventListener('load', sendHeight);
    /* Re-send whenever DOM changes (results appearing, sections expanding) */
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    } else {
      setInterval(sendHeight, 500);
    }
  })();
</script>
